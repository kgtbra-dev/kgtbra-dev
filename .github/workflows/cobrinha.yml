name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate GitHub Snake
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: kgtbra-dev
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%236d28d9&color_dots=%2321262d,%2330333b,%2339d353,%2300ff88,%23c026ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
